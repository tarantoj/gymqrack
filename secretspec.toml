[project]
name = "gymqrack"
revision = "1.0"

[profiles.default]
GYMQRACK_CLIENT_ID = { description = "VivaGym app client id (from the app's BuildConfig)", required = true }
GYMQRACK_CLIENT_SECRET = { description = "VivaGym app client secret (from the app's BuildConfig)", required = true }

GYMQRACK_LOCALE = { description = "UI language locale", default = "es" }
PORT = { description = "TCP port to listen on", default = "4567" }
PUBLIC_URL = { description = "Public base URL of the service", default = "http://localhost:4567" }
