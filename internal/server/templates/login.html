{{define "login"}}
<div id="loginView" class="card">
  <form hx-post="/auth/login" hx-target="#app" hx-swap="innerHTML">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="Email" required />
    <label for="current-password">Password / Contrase&ntilde;a</label>
    <div class="pass">
      <input id="current-password" name="password" type="password" autocomplete="current-password" placeholder="Password" enterkeyhint="done" required />
      <button type="button" class="toggle-pass" aria-pressed="false">Show</button>
    </div>
    <button type="submit" hx-disabled-elt="button">Sign in / Entrar</button>
    <p class="error" role="alert">{{.Error}}</p>
    <p class="forgot"><a href="https://www.vivagym.es" target="_blank" rel="noopener noreferrer">Forgot password? / &iquest;Olvidaste tu contrase&ntilde;a?</a></p>
  </form>
</div>
{{end}}
