{{define "qr"}}
<div id="qrView" hx-get="/qr/fragment" hx-trigger="every 60s, tabvisible" hx-swap="outerHTML">
  <div class="topbar">
    <span class="email">{{.Email}}</span>
    <button hx-post="/auth/logout" hx-target="#app" hx-swap="innerHTML" class="secondary">Log out</button>
  </div>
  <div id="qrWrap">{{.QR}}</div>
  <p class="description">This code lets you enter and leave the club. It&rsquo;s personal and non-transferable, so use it responsibly. / Este c&oacute;digo te permite acceder y salir del club. Es personal e intransferible. Haz un uso responsable del mismo.</p>
  <p id="status">Updated {{.Updated}}</p>
</div>
{{end}}
