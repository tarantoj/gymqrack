<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fd5000" />
  <title>VivaGym Entry QR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0f1115;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; color: #fd5000; }
    .card {
      width: min(90vw, 360px);
      background: #161a20;
      border: 1px solid #232a33;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2a323c;
      background: #0f1115;
      color: #fff;
      font-size: 1rem;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #fd5000;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #2a323c; }
    .error { color: #ff6b6b; font-size: 0.85rem; min-height: 1.2em; }
    .topbar {
      width: min(90vw, 360px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .topbar .email { font-size: 0.85rem; color: #9aa3af; overflow: hidden; text-overflow: ellipsis; }
    .topbar button { padding: 8px 14px; font-size: 0.85rem; }
    #qrWrap {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    #qrWrap svg { display: block; width: min(78vw, 340px); height: min(78vw, 340px); margin-inline: auto; }
    #status { margin: 0; font-size: 0.9rem; color: #9aa3af; }
    #payload {
      margin: 0;
      font-size: 0.72rem;
      color: #5b6470;
      word-break: break-all;
      max-width: 90vw;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>VivaGym — Entry / Acceso</h1>
  <div id="app">{{if eq .View "login"}}{{template "login" .}}{{else}}{{template "qr" .}}{{end}}</div>
  <script src="/htmx.min.js"></script>
</body>
</html>
