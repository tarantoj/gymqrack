<!doctype html>
<html lang="en"{{if .Watch}} class="watch"{{end}}>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fd5000" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gymqrack QR" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <title>Gymqrack Entry QR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0f1115;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; color: #fd5000; }
    .card {
      width: min(90vw, 360px);
      background: #161a20;
      border: 1px solid #232a33;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2a323c;
      background: #0f1115;
      color: #fff;
      font-size: 1rem;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #fd5000;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #2a323c; }
    .error { color: #ff6b6b; font-size: 0.85rem; min-height: 1.2em; }
    .topbar {
      width: min(90vw, 360px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .topbar .email { font-size: 0.85rem; color: #9aa3af; overflow: hidden; text-overflow: ellipsis; }
    .topbar button { padding: 8px 14px; font-size: 0.85rem; }
    .topbar, #qrWrap { user-select: none; -webkit-user-select: none; }
    #qrWrap {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    #qrWrap svg { display: block; width: min(84vw, 360px); height: min(84vw, 360px); margin-inline: auto; }
    #status { margin: 0; font-size: 0.9rem; color: #9aa3af; }
    #payload {
      margin: 0;
      font-size: 0.72rem;
      color: #5b6470;
      word-break: break-all;
      max-width: 90vw;
    }
    .hidden { display: none !important; }

    /* Apple Watch: every model reports a viewport <= 224px in both dimensions,
       so this media query only matches the watch. The UA-based .watch class is
       a fallback for newer watchOS builds that render at a wider virtual
       viewport. After login, show only the QR, full-bleed, for max scan area. */
    @media (max-width: 250px) and (max-height: 250px) {
      body {
        padding: 0;
        gap: 0;
        justify-content: flex-start;
      }
      h1, .topbar, #status, #payload { display: none; }
      .card {
        width: 100%;
        padding: 12px;
      }
      input, button { padding: 10px; }
      #qrView {
        width: 100%;
        height: 100dvh;
        overflow: hidden;
      }
      #qrWrap {
        width: 100%;
        height: 100%;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
      }
      #qrWrap svg { width: 100%; height: 100%; }
    }
    html.watch body { padding: 0; gap: 0; justify-content: flex-start; }
    html.watch h1, html.watch .topbar, html.watch #status, html.watch #payload { display: none; }
    html.watch .card { width: 100%; padding: 12px; }
    html.watch input, html.watch button { padding: 10px; }
    html.watch #qrView { width: 100%; height: 100dvh; overflow: hidden; }
    html.watch #qrWrap { width: 100%; height: 100%; padding: 0; border-radius: 0; box-shadow: none; }
    html.watch #qrWrap svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <h1>Gymqrack — Entry / Acceso</h1>
  <div id="app">{{if eq .View "login"}}{{template "login" .}}{{else}}{{template "qr" .}}{{end}}</div>
  <script src="/htmx.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
