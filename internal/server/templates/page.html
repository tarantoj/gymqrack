<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fd5000" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gymqrack QR" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <title>Gymqrack Entry QR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #f4f4f6;
      color: #1a1a1a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; color: #fd5000; }
    .card {
      width: min(90vw, 360px);
      background: #fff;
      border: 1px solid #e4e4e8;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d5d5db;
      background: #fafafa;
      color: #1a1a1a;
      font-size: 1rem;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #fd5000;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #e4e4e8; color: #1a1a1a; }
    .error { color: #d33; font-size: 0.85rem; min-height: 1.2em; }
    .topbar {
      width: min(90vw, 360px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .topbar .email { font-size: 0.85rem; color: #6b6b73; overflow: hidden; text-overflow: ellipsis; }
    .topbar button { padding: 8px 14px; font-size: 0.85rem; }
    .topbar, #qrWrap { user-select: none; -webkit-user-select: none; }
    #qrWrap {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
    }
    #qrWrap svg { display: block; width: min(56vw, 200px); height: min(56vw, 200px); margin-inline: auto; }
    .description {
      margin: 0;
      max-width: 340px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #4a4a52;
    }
    #status { margin: 0; font-size: 0.85rem; color: #8a8a92; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>Gymqrack — Entry / Acceso</h1>
  <div id="app">{{if eq .View "login"}}{{template "login" .}}{{else}}{{template "qr" .}}{{end}}</div>
  <script src="/htmx.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
