<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fd5000" />
  <title>VivaGym Entry QR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0f1115;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; color: #fd5000; }
    .card {
      width: min(90vw, 360px);
      background: #161a20;
      border: 1px solid #232a33;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2a323c;
      background: #0f1115;
      color: #fff;
      font-size: 1rem;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #fd5000;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #2a323c; }
    .error { color: #ff6b6b; font-size: 0.85rem; min-height: 1.2em; }
    .topbar {
      width: min(90vw, 360px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .topbar .email { font-size: 0.85rem; color: #9aa3af; overflow: hidden; text-overflow: ellipsis; }
    .topbar button { padding: 8px 14px; font-size: 0.85rem; }
    #qrWrap {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    #qr { display: block; width: min(78vw, 340px); height: min(78vw, 340px); }
    #status { margin: 0; font-size: 0.9rem; color: #9aa3af; }
    #payload {
      margin: 0;
      font-size: 0.72rem;
      color: #5b6470;
      word-break: break-all;
      max-width: 90vw;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>VivaGym — Entry / Acceso</h1>

  <div id="loginView" class="card hidden">
    <input id="email" type="email" inputmode="email" autocomplete="username" placeholder="Email" />
    <input id="password" type="password" autocomplete="current-password" placeholder="Password" />
    <button id="loginBtn">Sign in / Entrar</button>
    <p id="loginError" class="error"></p>
  </div>

  <div id="qrView" class="hidden">
    <div class="topbar">
      <span id="userEmail" class="email"></span>
      <button id="logoutBtn" class="secondary">Log out</button>
    </div>
    <div id="qrWrap"><img id="qr" alt="Gym entry QR code" /></div>
    <p id="status">Loading…</p>
    <p id="payload"></p>
  </div>

  <script>
    const loginView = document.getElementById("loginView");
    const qrView = document.getElementById("qrView");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const userEmail = document.getElementById("userEmail");
    const logoutBtn = document.getElementById("logoutBtn");
    const img = document.getElementById("qr");
    const statusEl = document.getElementById("status");
    const payloadEl = document.getElementById("payload");
    const REFRESH_MS = 60_000;
    let refreshTimer = null;

    function showLogin(message) {
      stopRefresh();
      qrView.classList.add("hidden");
      loginView.classList.remove("hidden");
      loginError.textContent = message || "";
      passwordInput.value = "";
    }

    function showQr(email) {
      loginView.classList.add("hidden");
      qrView.classList.remove("hidden");
      userEmail.textContent = email;
      loginError.textContent = "";
      refresh();
      refreshTimer = setInterval(refresh, REFRESH_MS);
    }

    async function refresh() {
      img.src = `/qr.svg?t=${Date.now()}`;
      try {
        const res = await fetch(`/qr?t=${Date.now()}`);
        if (res.status === 401) return showLogin("Session expired, sign in again");
        if (!res.ok) throw new Error("bad response");
        const data = await res.json();
        payloadEl.textContent = data.payload;
        statusEl.textContent = "Updated " + new Date(data.issuedAt).toLocaleTimeString();
      } catch {
        statusEl.textContent = "Could not refresh QR";
      }
    }

    function stopRefresh() {
      if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    }

    loginBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) {
        loginError.textContent = "Enter your email and password";
        return;
      }
      loginBtn.disabled = true;
      loginError.textContent = "";
      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          showQr(data.email || email);
        } else {
          loginError.textContent = data.error || "Sign in failed";
        }
      } catch {
        loginError.textContent = "Network error";
      } finally {
        loginBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await fetch("/auth/logout", { method: "POST" });
      showLogin();
    });

    // Enter key on the password field signs in
    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loginBtn.click();
    });

    (async () => {
      try {
        const res = await fetch("/auth/session");
        if (res.ok) {
          const data = await res.json();
          showQr(data.email);
        } else {
          showLogin();
        }
      } catch {
        showLogin();
      }
    })();
  </script>
</body>
</html>
