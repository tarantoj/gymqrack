name: VivaGym
options:
  minimumXcodeGenVersion: 2.44.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 45B9NG8M72
    # Avoid the CopyAndPreserveArchs duplicate-output build error when the
    # watch app is embedded in the iOS app for Debug.
    ONLY_ACTIVE_ARCH: NO

targets:
  # Shared VivaGymKit sources are compiled directly into each app target (and
  # the test bundle) rather than a framework: watch host/framework embedding is
  # avoided and only Apple-provided SDKs are needed.
  VivaGymWatch:
    type: application
    platform: watchOS
    sources:
      - path: VivaGymKit
      - path: VivaGymWatch
    info:
      path: VivaGymWatch/Info.plist
      properties:
        CFBundleDisplayName: VivaGym
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.vivagym.VivaGymCompanion
        UIBackgroundModes:
          - location
        NSLocationAlwaysAndWhenInUseUsageDescription: VivaGym uses your location to show your entry QR when you arrive at the gym.
        NSLocationWhenInUseUsageDescription: VivaGym uses your location to detect when you are near the gym.
        CFBundleLocalizations:
          - es
          - en
    entitlements:
      path: VivaGymWatch/VivaGymWatch.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)vivagym.session"
    settings:
      base:
        # watchOS requires the watch app bundle id to be prefixed by its
        # companion's ("com.vivagym.VivaGymCompanion." suffix), so it can be
        # installed on a watch paired with that iOS app. Single arm64 arch +
        # ONLY_ACTIVE_ARCH=NO avoids the CopyAndPreserveArchs duplicate-output
        # build error when the watch app is embedded in the iOS app.
        PRODUCT_BUNDLE_IDENTIFIER: com.vivagym.VivaGymCompanion.watchkitapp
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
    scheme:
      testTargets:
        - VivaGymKitTests

  VivaGymWatchCompanion:
    type: application
    platform: iOS
    sources:
      - path: VivaGymKit
      - path: VivaGymWatchCompanion
    # Embed the watch app so installing the iOS app installs it on the paired
    # watch and WatchConnectivity treats the two as a companion pair.
    dependencies:
      - target: VivaGymWatch
    info:
      path: VivaGymWatchCompanion/Info.plist
      properties:
        CFBundleDisplayName: VivaGym Watch
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
    entitlements:
      path: VivaGymWatchCompanion/VivaGymWatchCompanion.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)vivagym.session"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vivagym.VivaGymCompanion
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    scheme:
      testTargets:
        - VivaGymKitTests

  VivaGymKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VivaGymKit
      - path: VivaGymKitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vivagym.VivaGymKitTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  VivaGymWatch:
    build:
      targets:
        VivaGymWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VivaGymKitTests
  VivaGymWatchCompanion:
    build:
      targets:
        VivaGymWatchCompanion: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VivaGymKitTests
  VivaGymKitTests:
    build:
      targets:
        VivaGymKitTests: all
    test:
      config: Debug
      targets:
        - VivaGymKitTests